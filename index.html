<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0A" />
<title>Unhinged</title>
<style>
  /*
    Black and white, with royal purple and teal as tertiary accents only —
    dividers, line breaks, light borders. Never button fills or body text.

    The backdrop is painted by a fixed body::before layer rather than relying
    on html/body background alone: some embedding hosts override those, which
    strands light text on a light page.
  */
  :root {
    color-scheme: dark;
    --ink: #0a0a0a;
    --paper: #ffffff;
    --paper-text: #101012;
    --ground: #17171a;
    --raise: #232327;
    --text: #f4f4f6;
    --dim: #b9b9c2;
    --line: #33333a;
    --violet: #9b6dff;
    --teal: #2fd9c8;
    --pad: 20px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  /* Guaranteed dark backdrop, immune to host background overrides. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: var(--ink);
    z-index: -1;
  }

  body {
    position: relative;
    padding: max(18px, env(safe-area-inset-top)) var(--pad)
             calc(96px + env(safe-area-inset-bottom));
    max-width: 620px;
    margin: 0 auto;
  }

  h1, h2 { margin: 0; font-weight: 800; letter-spacing: -0.02em; }

  .brand {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.22em;
    color: var(--text);
    padding-bottom: 14px;
    border-bottom: 2px solid;
    border-image: linear-gradient(90deg, var(--violet), var(--teal)) 1;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .brand span { color: var(--dim); font-weight: 600; letter-spacing: .06em; font-size: 13px; }

  .charge {
    font-size: clamp(26px, 6.8vw, 36px);
    line-height: 1.14;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin: 0 0 8px;
    text-wrap: balance;
  }
  /* a played card gets a teal underline; a person's name, a violet one */
  .slot { border-bottom: 2px solid var(--teal); padding-bottom: 1px; }
  .slot.empty { color: var(--dim); border-bottom: 2px dashed var(--violet); }
  .person { color: var(--violet); border-bottom: 2px solid var(--violet); padding-bottom: 1px; }

  .meta { color: var(--dim); font-size: 14px; margin: 0 0 24px; }

  /* --- tappable rows -------------------------------------------------- */
  .row {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--ground);
    color: var(--text);
    border: 0;
    border-left: 4px solid var(--line);
    border-radius: 0 8px 8px 0;
    padding: 17px 16px;
    margin-bottom: 9px;
    font: inherit;
    font-weight: 600;
    min-height: 58px;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .row:active { background: var(--raise); }
  .row[aria-pressed="true"] { border-left-color: var(--violet); background: var(--raise); }
  .row:disabled { opacity: .45; cursor: default; }
  .row .sub { display: block; font-weight: 500; font-size: 13px; color: var(--dim); margin-top: 3px; }

  /* --- cards in hand, deliberately paper-like ------------------------- */
  .card {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--paper);
    color: var(--paper-text);
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 15px 16px;
    margin-bottom: 8px;
    font: inherit;
    font-weight: 650;
    line-height: 1.3;
    min-height: 56px;
    cursor: pointer;
    position: relative;
    transition: transform .1s, border-color .12s;
  }
  .card[aria-pressed="true"] { border-color: var(--violet); transform: translateX(10px); }
  .card .ord {
    position: absolute; top: 8px; right: 8px;
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--violet); border-radius: 50%;
    font-size: 11px; font-weight: 800; color: var(--paper-text);
  }

  :focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

  /* --- primary action, pinned ----------------------------------------- */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--ink) 68%, transparent);
  }
  .dock-inner { max-width: 620px; margin: 0 auto; display: flex; gap: 9px; }

  .go {
    flex: 1;
    background: var(--paper);
    color: var(--paper-text);
    border: 0; border-radius: 9px;
    padding: 18px;
    font: inherit; font-weight: 800;
    min-height: 58px; cursor: pointer;
  }
  .go:disabled { background: var(--raise); color: var(--dim); cursor: default; }
  .go.ghost { flex: 0 0 auto; background: var(--ground); color: var(--text); border: 2px solid var(--violet); padding: 18px 14px; }

  input[type=text] {
    width: 100%;
    background: var(--ground); color: var(--text);
    border: 2px solid var(--line); border-radius: 9px;
    padding: 16px; font: inherit; margin-bottom: 10px;
  }
  input[type=text]:focus { border-color: var(--violet); outline: none; }
  input::placeholder { color: var(--dim); }

  .note { color: var(--dim); font-size: 14px; }
  .err { color: var(--violet); font-size: 14px; min-height: 20px; margin-top: 8px; font-weight: 700; }

  /* --- verdict --------------------------------------------------------- */
  .verdict {
    background: var(--paper); color: var(--paper-text);
    border-radius: 10px; padding: 22px; margin-bottom: 14px;
    border-top: 4px solid;
    border-image: linear-gradient(90deg, var(--violet), var(--teal)) 1;
    animation: land .32s cubic-bezier(.2,.9,.3,1.2);
  }
  .verdict h2 { font-size: 29px; line-height: 1.08; }
  .verdict p { margin: 6px 0 0; font-weight: 600; font-size: 15px; opacity: .7; }
  @keyframes land { from { transform: scale(.94); opacity: 0 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .verdict { animation: none } }

  .clash {
    border: 2px solid var(--violet); border-radius: 10px;
    background: var(--ground);
    padding: 15px 17px; margin-bottom: 22px; color: var(--text);
  }
  .clash b { color: var(--violet); }

  /* Results rows sit on their own dark plate so they stay legible even if
     something upstream tries to impose a light background. */
  .tally {
    background: var(--ground);
    border-top: 2px solid var(--teal);
    border-radius: 0 0 6px 6px;
    padding: 14px 15px;
    margin-bottom: 8px;
    color: var(--text);
  }
  .tally .count { float: right; color: var(--text); font-weight: 800; font-size: 18px; margin-left: 10px; }
  .tally .line { font-weight: 600; }
  .tally .who { display: block; color: var(--dim); font-size: 13px; margin-top: 5px; }
  .tally.dupe { border-top-color: var(--violet); }

  .score { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
  .chip {
    background: var(--ground); border: 1px solid var(--teal);
    border-radius: 99px; padding: 7px 13px; font-size: 14px; font-weight: 600;
    color: var(--text);
  }
  .chip.off { opacity: .45; border-color: var(--line); }
  .chip em { font-style: normal; color: var(--text); font-weight: 800; }
  .hide { display: none; }

  /* --- lobby roster ---------------------------------------------------- */
  .roster { margin: 4px 0 0; }
  .who-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--ground);
    border-left: 3px solid var(--teal);
    border-radius: 0 8px 8px 0;
    padding: 14px 16px; margin-bottom: 8px;
    font-weight: 700;
    animation: slidein .22s ease-out;
  }
  .who-row.me { border-left-color: var(--violet); }
  .who-row .tag {
    margin-left: auto; font-size: 12px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
  }
  .who-row.me .tag { color: var(--violet); }
  @keyframes slidein { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { .who-row { animation: none } }

  .empty-seat {
    border: 2px dashed var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 8px;
    color: var(--dim); font-size: 14px;
  }
</style>
</head>

  ...TEXT.map(text => ({ text, type: "text" })),
  ...BLACK.map(text => ({ text, type: "hand", blanks: blanksIn(text) || 1 })),
  ...PERSON.map(text => ({ text, type: "person", play: "hand", blanks: blanksIn(text) || 1, person: true })),
];
const isHandRound = p => p && (p.type === "hand" || p.play === "hand");

// ─── deterministic core ─────────────────────────────────────────────────
// Prompts, hands, target players and vote order are all derived from a shared
// seed, so every client computes the same thing without a server telling it.

function hashStr(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seedNum) {
  const rnd = mulberry32(seedNum), a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Rounds follow PATTERN so "who here" prompts come up regularly instead of
// being buried in one big shuffle. Each type keeps its own pile.
//
// The pile index counts how many times this type has already come up, not how
// many pattern cycles have passed — "pick" appears three times per cycle, so a
// per-cycle index would serve the same prompt three times in a row.
function promptForRound(seed, round) {
  const len = PATTERN.length;
  const pos = (round - 1) % len;
  const type = PATTERN[pos];
  const perCycle = PATTERN.filter(t => t === type).length;
  const cycles = Math.floor((round - 1) / len);
  const seenBefore = cycles * perCycle + PATTERN.slice(0, pos).filter(t => t === type).length;
  const pile = seededShuffle(DECK.filter(d => d.type === type), hashStr(`pile:${seed}:${type}`));
  return pile[seenBefore % pile.length];
}

const NAME_OPEN = "\u0001", NAME_CLOSE = "\u0002";
const stripSentinels = s => s.split(NAME_OPEN).join("").split(NAME_CLOSE).join("");

// {player} / {player2} become real names, fixed for the round by the seed.
function resolvePrompt(prompt, seed, round, playerIds, nameOf) {
  if (!prompt.text.includes("{player")) return prompt;
  const order = seededShuffle([...playerIds].sort(), hashStr(`target:${seed}:${round}`));
  const first = order[0] ? nameOf(order[0]) : "somebody";
  const second = order[1] ? nameOf(order[1]) : first;
  const wrap = n => NAME_OPEN + n + NAME_CLOSE;
  return { ...prompt, text: prompt.text.replace(/\{player2\}/g, wrap(second)).replace(/\{player\}/g, wrap(first)) };
}

function fillPrompt(text, cards) {
  const parts = [], pending = [...cards];
  const pushBlanks = chunk => {
    let rest = chunk, m;
    while ((m = rest.match(/_{2,}/)) && pending.length) {
      if (m.index > 0) parts.push({ t: rest.slice(0, m.index), kind: "plain" });
      parts.push({ t: pending.shift(), kind: "card" });
      rest = rest.slice(m.index + m[0].length);
    }
    if (rest) parts.push({ t: rest, kind: "plain" });
  };
  text.split(NAME_OPEN).forEach((seg, i) => {
    if (i === 0) return pushBlanks(seg);
    const [name, tail = ""] = seg.split(NAME_CLOSE);
    parts.push({ t: name, kind: "person" });
    pushBlanks(tail);
  });
  while (pending.length) parts.push({ t: " " + pending.shift(), kind: "card" });
  return parts;
}

function dealHand(seed, round, pid, swaps) {
  const rnd = mulberry32(hashStr(`hand:${seed}:${round}:${pid}:${swaps || 0}`));
  const hand = []; let guard = 0;
  while (hand.length < 7 && guard++ < 2000) { const c = WHITE[Math.floor(rnd() * WHITE.length)]; if (!hand.includes(c)) hand.push(c); }
  return hand;
}

function groupAndOrder(prompt, answers, seed, round) {
  const groups = new Map();
  for (const pid of Object.keys(answers).sort()) {
    const cards = Array.isArray(answers[pid]) ? answers[pid] : [answers[pid]];
    const key = cards.join(" | ").toLowerCase().trim();
    if (!groups.has(key)) {
      groups.set(key, {
        id: key, authorIds: [],
        parts: isHandRound(prompt) ? fillPrompt(prompt.text, cards) : [{ t: cards[0], kind: "card" }],
      });
    }
    groups.get(key).authorIds.push(pid);
  }
  const canonical = [...groups.values()].sort((a, b) => a.id.localeCompare(b.id));
  return seededShuffle(canonical, hashStr(`entries:${seed}:${round}`));
}

function tallyPicks(answers, nameOf) {
  const counts = new Map();
  for (const voter of Object.keys(answers).sort()) { const t = answers[voter]; if (!counts.has(t)) counts.set(t, []); counts.get(t).push(voter); }
  const rows = [...counts.entries()].map(([targetId, voters]) => ({
    parts: [{ t: nameOf(targetId), kind: "person" }], targetIds: [targetId], count: voters.length, by: voters.map(nameOf),
  })).sort((a, b) => b.count - a.count);
  return finishTally(rows, [], "Most fingers pointed.");
}

function tallyEntries(entries, votes, nameOf) {
  const rows = entries.map(e => {
    const by = Object.entries(votes).filter(([, id]) => id === e.id).map(([v]) => nameOf(v)).sort();
    return { parts: e.parts, authors: e.authorIds.map(nameOf), targetIds: e.authorIds, count: by.length, by, duplicate: e.authorIds.length > 1 };
  }).sort((a, b) => b.count - a.count);
  const clashedIds = [];
  for (const r of rows.filter(r => r.duplicate)) for (const id of r.targetIds) clashedIds.push(id);
  return finishTally(rows, clashedIds, "Most votes for the worst answer.");
}

function finishTally(rows, clashedIds, note) {
  const top = rows.length ? rows[0].count : 0;
  const sentenced = [];
  if (top > 0) for (const r of rows.filter(r => r.count === top)) for (const id of r.targetIds) if (!sentenced.includes(id)) sentenced.push(id);
  const drinkCounts = {};
  for (const id of sentenced) drinkCounts[id] = (drinkCounts[id] || 0) + 1;
  for (const id of clashedIds) drinkCounts[id] = (drinkCounts[id] || 0) + 1;
  return { rows, sentenced, clashedIds, drinkCounts, note };
}

// ─── shared rendering helpers ───────────────────────────────────────────
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const partsHtml = parts => parts.map(p =>
  p.kind === "card" ? `<span class="slot">${esc(p.t)}</span>` :
  p.kind === "person" ? `<span class="person">${esc(p.t)}</span>` :
  esc(p.t)).join("");

// Walk tagged parts, dropping the cards chosen so far into the blanks.
function previewHtml(parts, cards) {
  let out = "", i = 0;
  for (const p of parts) {
    if (p.kind === "person") { out += `<span class="person">${esc(p.t)}</span>`; continue; }
    if (p.kind === "card") { out += `<span class="slot">${esc(p.t)}</span>`; continue; }
    let rest = p.t, m;
    while ((m = rest.match(/_{2,}/))) {
      out += esc(rest.slice(0, m.index));
      out += cards[i] ? `<span class="slot">${esc(cards[i])}</span>` : `<span class="slot empty">${esc(m[0])}</span>`;
      i++; rest = rest.slice(m.index + m[0].length);
    }
    out += esc(rest);
  }
  return out;
}


// ─── room + transport ───────────────────────────────────────────────────
// The LAN build pushes state over SSE from a live process. Hosted, there is
// no process, so every client polls one shared key-value store instead.
// A room code namespaces the keys; without it every group on the internet
// would land in the same game.

let room = (location.hash || "").replace("#", "").toUpperCase().slice(0, 6) || null;
const K = (k) => `room:${room}:${k}`;
const newRoomCode = () => {
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no I/O/0/1
  return Array.from({ length: 4 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join("");
};

let snap = {};      // every key in the room, refreshed each poll
let offline = false;

async function kvSet(key, value) {
  try {
    const r = await fetch("/api/kv", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, value }),
    });
    offline = !r.ok;
    return r.ok;
  } catch { offline = true; return false; }
}

async function kvDump() {
  try {
    const r = await fetch(`/api/kv?op=dump&prefix=${encodeURIComponent(`room:${room}:`)}`);
    if (!r.ok) { offline = true; return null; }
    offline = false;
    return (await r.json()).data || {};
  } catch { offline = true; return null; }
}

const setJSON = (key, obj) => kvSet(key, JSON.stringify(obj));
const readJSON = (key, fallback) => {
  try { return key in snap ? JSON.parse(snap[key]) : fallback; } catch { return fallback; }
};

// ─── local session ──────────────────────────────────────────────────────
let pid = null;
let myName = null;
let ui = { draft: null, picked: [] };
let players = [];
let game = null;

const uid = () => Math.random().toString(36).slice(2, 10);

// A failed read must never drop you from your own lobby.
function withSelf(list) {
  const arr = Array.isArray(list) ? list : [];
  if (pid && myName && !arr.some(p => p.id === pid)) return [...arr, { id: pid, name: myName }];
  return arr;
}

const nameOf = (id) => (players.find(p => p.id === id) || {}).name || "Someone who left";

// One key per player rather than a shared array: two people tapping join at
// the same moment would otherwise overwrite each other's entry.
function readPlayers() {
  const pre = K("player:");
  const out = [];
  for (const key of Object.keys(snap)) {
    if (!key.startsWith(pre)) continue;
    try { out.push(JSON.parse(snap[key])); } catch {}
  }
  out.sort((a, b) => (a.at - b.at) || a.id.localeCompare(b.id));
  return out;
}
// Host is simply whoever joined first, so it needs no stored field and
// survives the original host closing their tab.
const hostId = () => (players[0] || {}).id;

// No sockets here, so presence is a heartbeat. Someone who closes their tab
// would otherwise block every round forever waiting for an answer.
const GONE_AFTER = 30000;
function activePlayers() {
  const now = Date.now();
  return players.filter(p => {
    if (p.id === pid) return true;
    let seen = 0;
    try { seen = JSON.parse(snap[K(`seen:${p.id}`)] || "0"); } catch {}
    // brand-new joiners get a grace period before their first heartbeat
    return now - Math.max(seen, p.at || 0) < GONE_AFTER;
  });
}

function promptFor(round) {
  return resolvePrompt(promptForRound(game.seed, round), game.seed, round, players.map(p => p.id), nameOf);
}

// Pull every per-round key straight out of the snapshot.
function bucket(kind, round) {
  const pre = K(`${kind}:${game.seed}:${round}:`);
  const out = {};
  for (const key of Object.keys(snap)) {
    if (!key.startsWith(pre)) continue;
    try { out[key.slice(pre.length)] = JSON.parse(snap[key]); } catch {}
  }
  return out;
}

function tallyForRound(round) {
  const prompt = promptFor(round);
  const answers = bucket("ans", round);
  const swaps = bucket("swap", round);
  let tally;
  if (prompt.type === "pick") {
    tally = tallyPicks(answers, nameOf);
  } else {
    const entries = groupAndOrder(prompt, answers, game.seed, round);
    tally = entries.length < 2
      ? finishTally([], [], "Not enough answers.")
      : tallyEntries(entries, bucket("vote", round), nameOf);
  }
  for (const [sid, n] of Object.entries(swaps)) if (n > 0) tally.drinkCounts[sid] = (tally.drinkCounts[sid] || 0) + n;
  return tally;
}

function totalDrinks() {
  const totals = {};
  if (!game || !game.seed) return totals;
  const upTo = game.phase === "results" ? game.roundNum : game.roundNum - 1;
  for (let r = 1; r <= upTo; r++) {
    for (const [id, n] of Object.entries(tallyForRound(r).drinkCounts)) totals[id] = (totals[id] || 0) + n;
  }
  return totals;
}

// ─── joining ────────────────────────────────────────────────────────────
async function createRoom(name) {
  room = newRoomCode();
  location.hash = room;
  pid = uid(); myName = name;
  players = [{ id: pid, name, at: Date.now() }];
  game = { phase: "lobby", roundNum: 0, seed: null };
  await setJSON(K(`player:${pid}`), players[0]);
  await setJSON(K("game"), game);
}

async function joinRoom(name) {
  snap = (await kvDump()) || {};
  const current = readPlayers();
  const existing = current.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (existing) { pid = existing.id; myName = existing.name; players = current; }
  else {
    pid = uid(); myName = name;
    const me = { id: pid, name, at: Date.now() };
    players = [...current, me];
    await setJSON(K(`player:${pid}`), me);
  }
  game = readJSON(K("game"), null);
  if (!game) {
    game = { phase: "lobby", roundNum: 0, seed: null };
    await setJSON(K("game"), game);
  }
}

// ─── actions ────────────────────────────────────────────────────────────
async function act(type, payload) {
  if (type === "start") {
    if (activePlayers().length < 2) return;
    game = { phase: "answer", roundNum: 1, seed: uid() };
    await setJSON(K("game"), game);
  } else if (type === "next") {
    game = { ...game, phase: "answer", roundNum: game.roundNum + 1 };
    await setJSON(K("game"), game);
  } else if (type === "skip") {
    await advanceIfHost(true);
  } else if (type === "endGame") {
    game = { phase: "lobby", roundNum: 0, seed: null };
    await setJSON(K("game"), game);
  } else if (type === "submit") {
    await setJSON(K(`ans:${game.seed}:${game.roundNum}:${pid}`), payload);
  } else if (type === "vote") {
    await setJSON(K(`vote:${game.seed}:${game.roundNum}:${pid}`), payload);
  } else if (type === "swap") {
    const cur = bucket("swap", game.roundNum)[pid] || 0;
    await setJSON(K(`swap:${game.seed}:${game.roundNum}:${pid}`), cur + 1);
  }
  await tick();
}

async function advanceIfHost(force) {
  if (!game || pid !== hostId()) return;
  if (game.phase === "lobby" || game.phase === "results") return;
  const round = game.roundNum;
  const prompt = promptFor(round);

  if (game.phase === "answer") {
    const answers = bucket("ans", round);
    if (!activePlayers().every(p => answers[p.id] !== undefined) && !force) return;
    if (prompt.type === "pick") {
      game = { ...game, phase: "results" };
      return setJSON(K("game"), game);
    }
    const entries = groupAndOrder(prompt, answers, game.seed, round);
    game = { ...game, phase: entries.length < 2 ? "results" : "vote" };
    return setJSON(K("game"), game);
  }

  if (game.phase === "vote") {
    const votes = bucket("vote", round);
    if (!activePlayers().every(p => votes[p.id] !== undefined) && !force) return;
    game = { ...game, phase: "results" };
    return setJSON(K("game"), game);
  }
}

// ─── rendering ──────────────────────────────────────────────────────────
const app = document.getElementById("app");
const dock = document.getElementById("dock");
const dockInner = document.getElementById("dockInner");
const crumb = document.getElementById("crumb");

function setDock(buttons) {
  if (!buttons.length) return dock.classList.add("hide");
  dock.classList.remove("hide");
  dockInner.innerHTML = buttons.map((b, i) =>
    `<button class="go ${b.ghost ? "ghost" : ""}" data-i="${i}" ${b.disabled ? "disabled" : ""}>${esc(b.label)}</button>`).join("");
  [...dockInner.children].forEach((el, i) => (el.onclick = buttons[i].onClick));
}

const scoreboard = () => {
  const d = totalDrinks();
  return `<div class="score">${activePlayers().map(p =>
    `<span class="chip">${esc(p.name)} <em>${d[p.id] || 0}</em></span>`).join("")}</div>`;
};

function renderJoin(msg) {
  crumb.textContent = room ? room : "";
  dock.classList.add("hide");
  app.innerHTML = `
    <h1 class="charge">Everyone judges everyone. Someone drinks.</h1>
    <input type="text" id="nameIn" placeholder="Your name" maxlength="18" autocomplete="off" />
    <button class="go" id="joinBtn" style="width:100%">${room ? "Join " + esc(room) : "Start a room"}</button>
    <p class="err">${msg ? esc(msg) : ""}</p>`;

  const input = document.getElementById("nameIn");
  const go = async () => {
    const clean = input.value.trim().slice(0, 18);
    if (!clean) return renderJoin("Enter a name.");
    if (room) await joinRoom(clean); else await createRoom(clean);
    tick();
  };
  document.getElementById("joinBtn").onclick = go;
  input.onkeydown = e => { if (e.key === "Enter") go(); };
  input.focus();
}

function renderLobby() {
  const isHost = pid === hostId();
  crumb.textContent = room;
  const here = activePlayers();
  app.innerHTML = `
    <h1 class="charge">${here.length === 1 ? "Just you so far" : here.length + " in the room"}</h1>
    <p class="meta">Share the link, or the code <strong>${esc(room)}</strong>.</p>
    <div class="roster">
      ${here.map(p => {
        const tags = [];
        if (p.id === pid) tags.push("you");
        if (p.id === hostId()) tags.push("host");
        return `<div class="who-row ${p.id === pid ? "me" : ""}">
          <span>${esc(p.name)}</span><span class="tag">${tags.join(" · ")}</span></div>`;
      }).join("")}
      ${here.length < 2 ? `<div class="empty-seat">Waiting…</div>` : ""}
    </div>`;

  setDock(isHost
    ? [{ label: here.length < 2 ? "Need one more" : "Begin",
         disabled: here.length < 2, onClick: () => act("start") }]
    : []);
}

function renderAnswer() {
  const round = game.roundNum;
  const prompt = promptFor(round);
  const answers = bucket("ans", round);
  const isHost = pid === hostId();
  const waiting = activePlayers().filter(p => answers[p.id] === undefined).map(p => p.name);
  crumb.textContent = "round " + round;

  if (answers[pid] !== undefined) {
    const mine = answers[pid];
    const shown = prompt.type === "pick" ? nameOf(mine) : Array.isArray(mine) ? mine.join(" + ") : mine;
    app.innerHTML = `
      <h1 class="charge">${partsHtml(fillPrompt(prompt.text, []))}</h1>
      <p class="meta">You played <strong>${esc(shown)}</strong>.</p>
      <p class="note">${waiting.length ? esc(waiting.join(", ")) : "Everyone's in"}</p>`;
    return setDock(isHost && waiting.length ? [{ label: "Close it", onClick: () => act("skip") }] : []);
  }

  if (isHandRound(prompt)) {
    const swaps = bucket("swap", round)[pid] || 0;
    const hand = dealHand(game.seed, round, pid, swaps);
    const need = prompt.blanks || 1;
    app.innerHTML = `
      <h1 class="charge">${previewHtml(fillPrompt(prompt.text, []), ui.picked)}</h1>
      ${need > 1 ? `<p class="meta">Two cards, in order.</p>` : ""}
      ${hand.map(c => {
        const at = ui.picked.indexOf(c);
        return `<button class="card" data-card="${esc(c)}" aria-pressed="${at >= 0}">${esc(c)}${
          at >= 0 && need > 1 ? `<span class="ord">${at + 1}</span>` : ""}</button>`;
      }).join("")}`;
    app.querySelectorAll(".card").forEach(el => {
      el.onclick = () => {
        const c = el.dataset.card, at = ui.picked.indexOf(c);
        if (at >= 0) ui.picked.splice(at, 1);
        else if (ui.picked.length < need) ui.picked.push(c);
        else ui.picked = [...ui.picked.slice(1), c];
        render(true);
      };
    });
    return setDock([
      { label: "Play", disabled: ui.picked.length !== need,
        onClick: () => { const p = ui.picked; ui.picked = []; act("submit", p); } },
      { label: "New hand · 1", ghost: true, onClick: () => { ui.picked = []; act("swap"); } },
    ]);
  }

  if (prompt.type === "pick") {
    app.innerHTML = `
      <h1 class="charge">${partsHtml(fillPrompt(prompt.text, []))}</h1>
      ${activePlayers().map(p => `<button class="row" data-id="${p.id}" aria-pressed="${ui.draft === p.id}">${esc(p.name)}</button>`).join("")}`;
    app.querySelectorAll(".row").forEach(el => { el.onclick = () => { ui.draft = el.dataset.id; render(true); }; });
    return setDock([{ label: "Lock it in", disabled: !ui.draft,
      onClick: () => { const v = ui.draft; ui.draft = null; act("submit", v); } }]);
  }

  app.innerHTML = `
    <h1 class="charge">${partsHtml(fillPrompt(prompt.text, []))}</h1>
    <input type="text" id="ansIn" placeholder="Say the wrong thing" maxlength="200" autocomplete="off" />`;
  const input = document.getElementById("ansIn");
  input.value = ui.draft || "";
  input.oninput = () => { ui.draft = input.value; };
  setDock([{ label: "Submit", onClick: () => {
    const v = (input.value || "").trim().slice(0, 200);
    if (!v) return;
    ui.draft = null; act("submit", v);
  } }]);
}

function renderVote() {
  const round = game.roundNum;
  const prompt = promptFor(round);
  const entries = groupAndOrder(prompt, bucket("ans", round), game.seed, round);
  const votes = bucket("vote", round);
  const isHost = pid === hostId();
  const waiting = activePlayers().filter(p => votes[p.id] === undefined).map(p => p.name);
  crumb.textContent = "round " + round;

  if (votes[pid] !== undefined) {
    app.innerHTML = `<h1 class="charge">Voted.</h1>
      <p class="note">${waiting.length ? esc(waiting.join(", ")) : "Everyone's in"}</p>`;
    return setDock(isHost && waiting.length ? [{ label: "Call it", onClick: () => act("skip") }] : []);
  }

  app.innerHTML = `
    <h1 class="charge">Which one is worst?</h1>
    ${entries.map(e => {
      const mine = e.authorIds.includes(pid);
      return `<button class="row" data-id="${e.id}" aria-pressed="${ui.draft === e.id}" ${mine ? "disabled" : ""}>${
        partsHtml(e.parts)}${mine ? '<span class="sub">yours</span>' : ""}</button>`;
    }).join("")}`;
  app.querySelectorAll(".row:not(:disabled)").forEach(el => {
    el.onclick = () => { ui.draft = el.dataset.id; render(true); };
  });
  setDock([{ label: "Vote", disabled: !ui.draft,
    onClick: () => { const v = ui.draft; ui.draft = null; act("vote", v); } }]);
}

function renderResults() {
  const tally = tallyForRound(game.roundNum);
  const names = tally.sentenced.map(nameOf);
  const headline = !names.length ? "No verdict." : names.length === 1 ? names[0] + " drinks." : names.join(" and ") + " drink.";
  const clashed = [...new Set(tally.clashedIds.map(nameOf))];
  crumb.textContent = "verdict";

  app.innerHTML = `
    <div class="verdict"><h2>${esc(headline)}</h2><p>${esc(tally.note)}</p></div>
    ${clashed.length ? `<div class="clash"><b>Same card.</b> ${esc(clashed.join(", "))} drink too.</div>` : ""}
    ${tally.rows.map(r => `
      <div class="tally ${r.duplicate ? "dupe" : ""}">
        <span class="count">${r.count}</span>
        <span class="line">${partsHtml(r.parts)}</span>
        ${r.authors ? `<span class="who">${esc(r.authors.join(" and "))}</span>` : ""}
      </div>`).join("")}
    ${scoreboard()}`;

  setDock(pid === hostId()
    ? [{ label: "Next round", onClick: () => { ui.picked = []; act("next"); } },
       { label: "Stop", ghost: true, onClick: () => act("endGame") }]
    : []);
}

function render(force) {
  const el = document.activeElement;
  if (!force && el && el.id === "ansIn") return;
  if (!pid) return renderJoin();
  if (!game || game.phase === "lobby") return renderLobby();
  if (game.phase === "answer") return renderAnswer();
  if (game.phase === "vote") return renderVote();
  if (game.phase === "results") return renderResults();
}

// ─── poll loop ──────────────────────────────────────────────────────────
let ticking = false;
let beat = 0;
async function tick() {
  if (!pid || !room || ticking) return;
  ticking = true;
  try {
    if (beat++ % 4 === 0) kvSet(K(`seen:${pid}`), JSON.stringify(Date.now()));
    const data = await kvDump();
    if (data) {
      snap = data;
      players = withSelf(readPlayers());
      game = readJSON(K("game"), game);
      await advanceIfHost(false);
    }
    render();
  } finally { ticking = false; }
}

renderJoin();
setInterval(tick, 1500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
window.addEventListener("hashchange", () => location.reload());

function __debug() { return { pid, room, players, game, snap }; }

</script>
